<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 730" role="img" aria-labelledby="title desc"><title id="title">Holiday budget by phase</title><desc id="desc">Planned Meta budget: early warm-up fifteen thousand, pre-BFCM forty thousand, extended peak eighty-five thousand, holiday prime forty-five thousand and post-holiday fifteen thousand, totaling two hundred thousand dollars.</desc><rect width="600" height="730" fill="#202025"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="55" fill="#eeeef2" font-size="30" font-weight="600">The $200,000 holiday budget plan</text><text x="36" y="91" fill="#b8b8c2" font-size="20" font-weight="400">Planned Meta dollars · November–December 2025</text><text x="36" y="140" fill="#eeeef2" font-size="23" font-weight="400">Early warm-up</text><text x="435" y="140" fill="#77cdd5" font-size="23" font-weight="600">$15,000</text><rect x="36" y="162" width="93.18" height="22" rx="4" fill="#9898a5" stroke="none"/><text x="36" y="255" fill="#eeeef2" font-size="23" font-weight="400">Pre-BFCM ramp</text><text x="435" y="255" fill="#77cdd5" font-size="23" font-weight="600">$40,000</text><rect x="36" y="277" width="248.47" height="22" rx="4" fill="#9898a5" stroke="none"/><text x="36" y="370" fill="#eeeef2" font-size="23" font-weight="400">BFCM + extended peak</text><text x="435" y="370" fill="#77cdd5" font-size="23" font-weight="600">$85,000</text><rect x="36" y="392" width="528.0" height="22" rx="4" fill="#77cdd5" stroke="none"/><text x="36" y="485" fill="#eeeef2" font-size="23" font-weight="400">Holiday prime</text><text x="435" y="485" fill="#77cdd5" font-size="23" font-weight="600">$45,000</text><rect x="36" y="507" width="279.53" height="22" rx="4" fill="#9898a5" stroke="none"/><text x="36" y="600" fill="#eeeef2" font-size="23" font-weight="400">Post-holiday</text><text x="435" y="600" fill="#77cdd5" font-size="23" font-weight="600">$15,000</text><rect x="36" y="622" width="93.18" height="22" rx="4" fill="#9898a5" stroke="none"/></g></svg>