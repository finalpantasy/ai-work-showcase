<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 555" role="img" aria-labelledby="title desc"><title id="title">Holiday budget by phase</title><desc id="desc">Planned Meta budget: early warm-up fifteen thousand, pre-BFCM forty thousand, extended peak eighty-five thousand, holiday prime forty-five thousand and post-holiday fifteen thousand, totaling two hundred thousand dollars.</desc><rect width="1100" height="555" fill="#202025"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="55" fill="#eeeef2" font-size="30" font-weight="600">The $200,000 holiday budget plan</text><text x="36" y="91" fill="#b8b8c2" font-size="20" font-weight="400">Planned Meta dollars · November–December 2025</text><text x="36" y="155" fill="#eeeef2" font-size="23" font-weight="400">Early warm-up</text><rect x="330" y="134" width="103.24" height="27" rx="4" fill="#9898a5" stroke="none"/><text x="940" y="155" fill="#eeeef2" font-size="23" font-weight="600">$15,000</text><text x="36" y="237" fill="#eeeef2" font-size="23" font-weight="400">Pre-BFCM ramp</text><rect x="330" y="216" width="275.29" height="27" rx="4" fill="#9898a5" stroke="none"/><text x="940" y="237" fill="#eeeef2" font-size="23" font-weight="600">$40,000</text><text x="36" y="319" fill="#eeeef2" font-size="23" font-weight="400">BFCM + extended peak</text><rect x="330" y="298" width="585.0" height="27" rx="4" fill="#77cdd5" stroke="none"/><text x="940" y="319" fill="#eeeef2" font-size="23" font-weight="600">$85,000</text><text x="36" y="401" fill="#eeeef2" font-size="23" font-weight="400">Holiday prime</text><rect x="330" y="380" width="309.71" height="27" rx="4" fill="#9898a5" stroke="none"/><text x="940" y="401" fill="#eeeef2" font-size="23" font-weight="600">$45,000</text><text x="36" y="483" fill="#eeeef2" font-size="23" font-weight="400">Post-holiday</text><rect x="330" y="462" width="103.24" height="27" rx="4" fill="#9898a5" stroke="none"/><text x="940" y="483" fill="#eeeef2" font-size="23" font-weight="600">$15,000</text></g></svg>