<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Marketing tools overview</title><desc id="desc">Understand an account, review ads, prepare searches and ad imports, and review saved context. These are the public sample tasks.</desc><rect width="1100" height="520" fill="#202025"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="55" fill="#eeeef2" font-size="30" font-weight="600">Useful work, from question to next step.</text><text x="36" y="91" fill="#b8b8c2" font-size="20" font-weight="400">The marketing tools in this portfolio</text><rect x="36" y="147" width="516" height="115" rx="12" fill="#29292f" stroke="none"/><text x="60" y="188" fill="#eeeef2" font-size="26" font-weight="600">Understand the account</text><text x="60" y="232" fill="#b8b8c2" font-size="21" font-weight="400">Find where sales changed</text><rect x="584" y="147" width="516" height="115" rx="12" fill="#29292f" stroke="none"/><text x="608" y="188" fill="#eeeef2" font-size="26" font-weight="600">Review the ads</text><text x="608" y="232" fill="#b8b8c2" font-size="21" font-weight="400">Prepare a brief worth making</text><rect x="36" y="340" width="516" height="115" rx="12" fill="#29292f" stroke="none"/><text x="60" y="381" fill="#eeeef2" font-size="26" font-weight="600">Get the work ready</text><text x="60" y="425" fill="#b8b8c2" font-size="21" font-weight="400">Check searches and build the import</text><rect x="584" y="340" width="516" height="115" rx="12" fill="#29292f" stroke="none"/><text x="608" y="381" fill="#eeeef2" font-size="26" font-weight="600">Keep useful context</text><text x="608" y="425" fill="#b8b8c2" font-size="21" font-weight="400">Review a note before reusing it</text></g></svg>