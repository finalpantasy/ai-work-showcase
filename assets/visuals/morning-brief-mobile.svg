<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 755" role="img" aria-labelledby="title desc"><title id="title">A sample morning brief</title><desc id="desc">Four task groups: a prepared creative comment, a reporting-format decision, a task waiting for an image, and a report already owned by another routine.</desc><rect width="600" height="755" fill="#202025"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="55" fill="#eeeef2" font-size="30" font-weight="600">Open the day with useful work ready.</text><text x="36" y="91" fill="#b8b8c2" font-size="20" font-weight="400">Sample morning brief</text><path d="M36 126 L564 126" fill="none" stroke="#45454e" stroke-width="1"/><circle cx="48" cy="158" r="6" fill="#77cdd5"/><text x="69" y="165" fill="#77cdd5" font-size="25" font-weight="600">Ready to review</text><text x="69" y="204" fill="#eeeef2" font-size="24" font-weight="400">Creative comment drafted</text><text x="69" y="243" fill="#b8b8c2" font-size="20" font-weight="400">Read it, then approve the exact text.</text><path d="M36 270 L564 270" fill="none" stroke="#45454e" stroke-width="1"/><circle cx="48" cy="302" r="6" fill="#77cdd5"/><text x="69" y="309" fill="#77cdd5" font-size="25" font-weight="600">Needs me</text><text x="69" y="348" fill="#eeeef2" font-size="24" font-weight="400">Choose the report format</text><text x="69" y="387" fill="#b8b8c2" font-size="20" font-weight="400">Short answer first, with the source.</text><path d="M36 414 L564 414" fill="none" stroke="#45454e" stroke-width="1"/><circle cx="48" cy="446" r="6" fill="#858590"/><text x="69" y="453" fill="#77cdd5" font-size="25" font-weight="600">Blocked</text><text x="69" y="492" fill="#eeeef2" font-size="24" font-weight="400">Waiting for the product image</text><text x="69" y="531" fill="#b8b8c2" font-size="20" font-weight="400">The creative draft needs its asset.</text><path d="M36 558 L564 558" fill="none" stroke="#45454e" stroke-width="1"/><circle cx="48" cy="590" r="6" fill="#858590"/><text x="69" y="597" fill="#77cdd5" font-size="25" font-weight="600">Already covered</text><text x="69" y="636" fill="#eeeef2" font-size="24" font-weight="400">Weekly account report</text><text x="69" y="675" fill="#b8b8c2" font-size="20" font-weight="400">The reporting routine owns this one.</text></g></svg>