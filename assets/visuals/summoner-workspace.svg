<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 565" role="img" aria-labelledby="title desc"><title id="title">Summoner illustrated workspace</title><desc id="desc">Conceptual layout combining project context, an AI conversation and changes for review. Sample project and task.</desc><rect width="1100" height="565" fill="#202025"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="55" fill="#eeeef2" font-size="30" font-weight="600">Summoner</text><text x="36" y="91" fill="#b8b8c2" font-size="20" font-weight="400">Illustrated workspace layout</text><rect x="36" y="132" width="1028" height="52" rx="12" fill="#303038" stroke="none"/><circle cx="59" cy="158" r="6" fill="#77cdd5"/><text x="78" y="166" fill="#eeeef2" font-size="23" font-weight="600">Project · Marketing tools</text><rect x="36" y="206" width="240" height="309" rx="12" fill="#29292f" stroke="none"/><text x="57" y="245" fill="#eeeef2" font-size="24" font-weight="600">Project context</text><circle cx="61" cy="289" r="4" fill="#858590"/><text x="77" y="297" fill="#b8b8c2" font-size="21" font-weight="400">Goal</text><circle cx="61" cy="340" r="4" fill="#858590"/><text x="77" y="348" fill="#b8b8c2" font-size="21" font-weight="400">Decisions</text><circle cx="61" cy="391" r="4" fill="#858590"/><text x="77" y="399" fill="#b8b8c2" font-size="21" font-weight="400">Current state</text><circle cx="61" cy="442" r="4" fill="#858590"/><text x="77" y="450" fill="#b8b8c2" font-size="21" font-weight="400">Open work</text><text x="304" y="243" fill="#eeeef2" font-size="26" font-weight="600">AI conversation</text><rect x="304" y="266" width="760" height="95" rx="12" fill="#29292f" stroke="none"/><text x="327" y="305" fill="#eeeef2" font-size="23" font-weight="400">Prepare the next creative brief.</text><text x="327" y="338" fill="#b8b8c2" font-size="20" font-weight="400">Use the approved message and current product details.</text><path d="M304 390 L1064 390" fill="none" stroke="#45454e" stroke-width="1"/><text x="304" y="431" fill="#77cdd5" font-size="26" font-weight="600">Changes to review</text><text x="304" y="469" fill="#eeeef2" font-size="21" font-weight="400">The draft, its source and the next decision stay together.</text></g></svg>