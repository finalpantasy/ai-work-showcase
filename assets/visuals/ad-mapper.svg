<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc"><title id="title">Planner to import file</title><desc id="desc">An invented planner skips headline two. The output preserves the two headlines, compacts the gap and carries the destination link.</desc><rect width="1100" height="490" fill="#202025"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="55" fill="#eeeef2" font-size="30" font-weight="600">One planner. One import file.</text><text x="36" y="91" fill="#b8b8c2" font-size="20" font-weight="400">Keep the copy. Close the gaps. Check the links.</text><rect x="36" y="151" width="490" height="250" rx="12" fill="#29292f" stroke="none"/><text x="60" y="194" fill="#eeeef2" font-size="28" font-weight="600">Planner row</text><path d="M60 212 L502 212" fill="none" stroke="#45454e" stroke-width="1"/><text x="60" y="246" fill="#eeeef2" font-size="20" font-weight="400">Headline 1 · Built for the detour</text><path d="M60 266 L502 266" fill="none" stroke="#45454e" stroke-width="1"/><text x="60" y="300" fill="#b8b8c2" font-size="20" font-weight="400">Headline 2 · Empty</text><path d="M60 320 L502 320" fill="none" stroke="#45454e" stroke-width="1"/><text x="60" y="354" fill="#eeeef2" font-size="20" font-weight="400">Headline 3 · A little more outside</text><path d="M538 274 L562 274" fill="none" stroke="#77cdd5" stroke-width="2"/><rect x="574" y="151" width="490" height="250" rx="12" fill="#29292f" stroke="none"/><text x="598" y="194" fill="#eeeef2" font-size="28" font-weight="600">Ready for the import</text><path d="M598 212 L1040 212" fill="none" stroke="#45454e" stroke-width="1"/><text x="598" y="246" fill="#eeeef2" font-size="20" font-weight="400">Headline 1 · Built for the detour</text><path d="M598 266 L1040 266" fill="none" stroke="#45454e" stroke-width="1"/><text x="598" y="300" fill="#eeeef2" font-size="20" font-weight="400">Headline 2 · A little more outside</text><path d="M598 320 L1040 320" fill="none" stroke="#45454e" stroke-width="1"/><text x="598" y="354" fill="#eeeef2" font-size="20" font-weight="400">Destination · example.com/bottle</text></g></svg>