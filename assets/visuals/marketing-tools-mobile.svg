<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-labelledby="title desc"><title id="title">Marketing tools overview</title><desc id="desc">Understand an account, review ads, prepare searches and ad imports, and review saved context. These are the public sample tasks.</desc><rect width="600" height="750" fill="#202025"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="55" fill="#eeeef2" font-size="30" font-weight="600">Useful work, from question to next step.</text><text x="36" y="91" fill="#b8b8c2" font-size="20" font-weight="400">The marketing tools in this portfolio</text><rect x="36" y="143" width="528" height="115" rx="12" fill="#29292f" stroke="none"/><text x="60" y="184" fill="#eeeef2" font-size="26" font-weight="600">Understand the account</text><text x="60" y="228" fill="#b8b8c2" font-size="21" font-weight="400">Find where sales changed</text><path d="M300 262 L300 282" fill="none" stroke="#77cdd5" stroke-width="2"/><rect x="36" y="284" width="528" height="115" rx="12" fill="#29292f" stroke="none"/><text x="60" y="325" fill="#eeeef2" font-size="26" font-weight="600">Review the ads</text><text x="60" y="369" fill="#b8b8c2" font-size="21" font-weight="400">Prepare a brief worth making</text><path d="M300 403 L300 423" fill="none" stroke="#77cdd5" stroke-width="2"/><rect x="36" y="425" width="528" height="115" rx="12" fill="#29292f" stroke="none"/><text x="60" y="466" fill="#eeeef2" font-size="26" font-weight="600">Get the work ready</text><text x="60" y="510" fill="#b8b8c2" font-size="21" font-weight="400">Check searches and build the import</text><path d="M300 544 L300 564" fill="none" stroke="#77cdd5" stroke-width="2"/><rect x="36" y="566" width="528" height="115" rx="12" fill="#29292f" stroke="none"/><text x="60" y="607" fill="#eeeef2" font-size="26" font-weight="600">Keep useful context</text><text x="60" y="651" fill="#b8b8c2" font-size="21" font-weight="400">Review a note before reusing it</text></g></svg>