<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="title desc"><title id="title">Prepare review approve verify</title><desc id="desc">Prepare the exact change, review scope and source, approve only that version, then verify the result.</desc><rect width="600" height="700" fill="#202025"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="55" fill="#eeeef2" font-size="30" font-weight="600">Make the change clear before acting.</text><text x="36" y="91" fill="#b8b8c2" font-size="20" font-weight="400">The checks behind the public examples</text><circle cx="56" cy="172" r="14" fill="#77cdd5"/><text x="84" y="181" fill="#eeeef2" font-size="27" font-weight="600">Prepare</text><text x="84" y="225" fill="#b8b8c2" font-size="20" font-weight="400">The exact draft or change</text><path d="M56 191 L56 268" fill="none" stroke="#6d6d79" stroke-width="2"/><circle cx="56" cy="305" r="14" fill="#77cdd5"/><text x="84" y="314" fill="#eeeef2" font-size="27" font-weight="600">Review</text><text x="84" y="358" fill="#b8b8c2" font-size="20" font-weight="400">Scope, source and destination</text><path d="M56 324 L56 401" fill="none" stroke="#6d6d79" stroke-width="2"/><circle cx="56" cy="438" r="14" fill="#77cdd5"/><text x="84" y="447" fill="#eeeef2" font-size="27" font-weight="600">Approve</text><text x="84" y="491" fill="#b8b8c2" font-size="20" font-weight="400">Only the reviewed version</text><path d="M56 457 L56 534" fill="none" stroke="#6d6d79" stroke-width="2"/><circle cx="56" cy="571" r="14" fill="#77cdd5"/><text x="84" y="580" fill="#eeeef2" font-size="27" font-weight="600">Verify</text><text x="84" y="624" fill="#b8b8c2" font-size="20" font-weight="400">Check what actually happened</text></g></svg>