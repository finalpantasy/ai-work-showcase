<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 735" role="img" aria-labelledby="title desc"><title id="title">Planner to import file</title><desc id="desc">An invented planner skips headline two. The output preserves the two headlines, compacts the gap and carries the destination link.</desc><rect width="600" height="735" fill="#202025"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="55" fill="#eeeef2" font-size="30" font-weight="600">One planner. One import file.</text><text x="36" y="91" fill="#b8b8c2" font-size="20" font-weight="400">Keep the copy. Close the gaps. Check the links.</text><rect x="36" y="132" width="528" height="250" rx="12" fill="#29292f" stroke="none"/><text x="60" y="175" fill="#eeeef2" font-size="28" font-weight="600">Planner row</text><path d="M60 193 L540 193" fill="none" stroke="#45454e" stroke-width="1"/><text x="60" y="227" fill="#eeeef2" font-size="20" font-weight="400">Headline 1 · Built for the detour</text><path d="M60 247 L540 247" fill="none" stroke="#45454e" stroke-width="1"/><text x="60" y="281" fill="#b8b8c2" font-size="20" font-weight="400">Headline 2 · Empty</text><path d="M60 301 L540 301" fill="none" stroke="#45454e" stroke-width="1"/><text x="60" y="335" fill="#eeeef2" font-size="20" font-weight="400">Headline 3 · A little more outside</text><path d="M300 393 L300 418" fill="none" stroke="#77cdd5" stroke-width="2"/><rect x="36" y="428" width="528" height="250" rx="12" fill="#29292f" stroke="none"/><text x="60" y="471" fill="#eeeef2" font-size="28" font-weight="600">Ready for the import</text><path d="M60 489 L540 489" fill="none" stroke="#45454e" stroke-width="1"/><text x="60" y="523" fill="#eeeef2" font-size="20" font-weight="400">Headline 1 · Built for the detour</text><path d="M60 543 L540 543" fill="none" stroke="#45454e" stroke-width="1"/><text x="60" y="577" fill="#eeeef2" font-size="20" font-weight="400">Headline 2 · A little more outside</text><path d="M60 597 L540 597" fill="none" stroke="#45454e" stroke-width="1"/><text x="60" y="631" fill="#eeeef2" font-size="20" font-weight="400">Destination · example.com/bottle</text></g></svg>