<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-labelledby="title desc"><title id="title">How Claude Quest works</title><desc id="desc">Reading, editing and tools create session events. Local checks handle repeated events; the companion progresses and saves locally without extra model calls.</desc><rect width="600" height="800" fill="#202025"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="55" fill="#eeeef2" font-size="30" font-weight="600">Claude Quest</text><text x="36" y="91" fill="#b8b8c2" font-size="20" font-weight="400">Work activity becomes local progress.</text><rect x="36" y="139" width="528" height="116" rx="12" fill="#29292f" stroke="none"/><circle cx="63" cy="170" r="5" fill="#77cdd5"/><text x="81" y="179" fill="#eeeef2" font-size="27" font-weight="600">Session activity</text><text x="60" y="226" fill="#b8b8c2" font-size="23" font-weight="400">Read · Edit · Use tools</text><path d="M300 259 L300 279" fill="none" stroke="#6d6d79" stroke-width="2"/><rect x="36" y="283" width="528" height="116" rx="12" fill="#29292f" stroke="none"/><circle cx="63" cy="314" r="5" fill="#77cdd5"/><text x="81" y="323" fill="#eeeef2" font-size="27" font-weight="600">Local event check</text><text x="60" y="370" fill="#b8b8c2" font-size="23" font-weight="400">Handle repeated events</text><path d="M300 403 L300 423" fill="none" stroke="#6d6d79" stroke-width="2"/><rect x="36" y="427" width="528" height="116" rx="12" fill="#29292f" stroke="none"/><circle cx="63" cy="458" r="5" fill="#77cdd5"/><text x="81" y="467" fill="#eeeef2" font-size="27" font-weight="600">Companion progress</text><text x="60" y="514" fill="#b8b8c2" font-size="23" font-weight="400">Character · Gear · Camp</text><path d="M300 547 L300 567" fill="none" stroke="#6d6d79" stroke-width="2"/><rect x="36" y="571" width="528" height="116" rx="12" fill="#29292f" stroke="none"/><circle cx="63" cy="602" r="5" fill="#77cdd5"/><text x="81" y="611" fill="#eeeef2" font-size="27" font-weight="600">Local save</text><text x="60" y="658" fill="#b8b8c2" font-size="23" font-weight="400">Keep progress between sessions</text><text x="36" y="760" fill="#77cdd5" font-size="22" font-weight="400">No extra model calls for progression.</text></g></svg>