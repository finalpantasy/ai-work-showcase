<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 730" role="img" aria-labelledby="title desc"><title id="title">A practical AI learning path</title><desc id="desc">Start with a clear question and source; draft and check useful work; then connect tools and repeat tasks with review.</desc><rect width="600" height="730" fill="#202025"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="55" fill="#eeeef2" font-size="30" font-weight="600">Help people use AI at work</text><text x="36" y="91" fill="#b8b8c2" font-size="20" font-weight="400">Useful tasks. Practice. Someone to check with.</text><rect x="36" y="138" width="528" height="152" rx="12" fill="#29292f" stroke="none"/><text x="60" y="177" fill="#77cdd5" font-size="28" font-weight="600">Start small</text><text x="60" y="221" fill="#eeeef2" font-size="21" font-weight="400">Ask a clear account question</text><text x="60" y="257" fill="#b8b8c2" font-size="21" font-weight="400">Give it the right source</text><path d="M300 293 L300 321" fill="none" stroke="#6d6d79" stroke-width="2"/><rect x="36" y="323" width="528" height="152" rx="12" fill="#29292f" stroke="none"/><text x="60" y="362" fill="#77cdd5" font-size="28" font-weight="600">Build the habit</text><text x="60" y="406" fill="#eeeef2" font-size="21" font-weight="400">Draft a report or creative brief</text><text x="60" y="442" fill="#b8b8c2" font-size="21" font-weight="400">Check the answer together</text><path d="M300 478 L300 506" fill="none" stroke="#6d6d79" stroke-width="2"/><rect x="36" y="508" width="528" height="152" rx="12" fill="#29292f" stroke="none"/><text x="60" y="547" fill="#77cdd5" font-size="28" font-weight="600">Go deeper</text><text x="60" y="591" fill="#eeeef2" font-size="21" font-weight="400">Connect tools and repeat tasks</text><text x="60" y="627" fill="#b8b8c2" font-size="21" font-weight="400">Review before taking action</text></g></svg>