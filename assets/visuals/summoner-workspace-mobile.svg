<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 695" role="img" aria-labelledby="title desc"><title id="title">Summoner illustrated workspace</title><desc id="desc">Conceptual layout combining project context, an AI conversation and changes for review. Sample project and task.</desc><rect width="600" height="695" fill="#202025"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="55" fill="#eeeef2" font-size="30" font-weight="600">Summoner</text><text x="36" y="91" fill="#b8b8c2" font-size="20" font-weight="400">Illustrated workspace layout</text><rect x="36" y="132" width="528" height="52" rx="12" fill="#303038" stroke="none"/><circle cx="59" cy="158" r="6" fill="#77cdd5"/><text x="78" y="166" fill="#eeeef2" font-size="23" font-weight="600">Project · Marketing tools</text><text x="36" y="227" fill="#eeeef2" font-size="26" font-weight="600">The project stays with the chat.</text><rect x="36" y="252" width="528" height="108" rx="12" fill="#29292f" stroke="none"/><text x="60" y="291" fill="#77cdd5" font-size="26" font-weight="600">Project context</text><text x="60" y="332" fill="#eeeef2" font-size="21" font-weight="400">Goal, decisions and current state</text><rect x="36" y="384" width="528" height="108" rx="12" fill="#29292f" stroke="none"/><text x="60" y="423" fill="#77cdd5" font-size="26" font-weight="600">AI conversation</text><text x="60" y="464" fill="#eeeef2" font-size="21" font-weight="400">Task, useful context and a result</text><rect x="36" y="516" width="528" height="108" rx="12" fill="#29292f" stroke="none"/><text x="60" y="555" fill="#77cdd5" font-size="26" font-weight="600">Changes to review</text><text x="60" y="596" fill="#eeeef2" font-size="21" font-weight="400">See what changed before combining it</text></g></svg>