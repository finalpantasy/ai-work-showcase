<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc"><title id="title">A practical AI learning path</title><desc id="desc">Start with a clear question and source; draft and check useful work; then connect tools and repeat tasks with review.</desc><rect width="1100" height="510" fill="#202025"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="55" fill="#eeeef2" font-size="30" font-weight="600">Help people use AI at work</text><text x="36" y="91" fill="#b8b8c2" font-size="20" font-weight="400">Useful tasks. Practice. Someone to check with.</text><rect x="36" y="164" width="322" height="152" rx="12" fill="#29292f" stroke="none"/><text x="60" y="203" fill="#77cdd5" font-size="28" font-weight="600">Start small</text><text x="60" y="247" fill="#eeeef2" font-size="21" font-weight="400">Ask a clear account question</text><text x="60" y="283" fill="#b8b8c2" font-size="21" font-weight="400">Give it the right source</text><path d="M360 241 L387 286" fill="none" stroke="#6d6d79" stroke-width="2"/><rect x="390" y="209" width="322" height="152" rx="12" fill="#29292f" stroke="none"/><text x="414" y="248" fill="#77cdd5" font-size="28" font-weight="600">Build the habit</text><text x="414" y="292" fill="#eeeef2" font-size="21" font-weight="400">Draft a report or creative brief</text><text x="414" y="328" fill="#b8b8c2" font-size="21" font-weight="400">Check the answer together</text><path d="M714 286 L741 331" fill="none" stroke="#6d6d79" stroke-width="2"/><rect x="744" y="254" width="322" height="152" rx="12" fill="#29292f" stroke="none"/><text x="768" y="293" fill="#77cdd5" font-size="28" font-weight="600">Go deeper</text><text x="768" y="337" fill="#eeeef2" font-size="21" font-weight="400">Connect tools and repeat tasks</text><text x="768" y="373" fill="#b8b8c2" font-size="21" font-weight="400">Review before taking action</text></g></svg>