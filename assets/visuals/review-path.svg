<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc"><title id="title">Prepare review approve verify</title><desc id="desc">Prepare the exact change, review scope and source, approve only that version, then verify the result.</desc><rect width="1100" height="410" fill="#202025"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="55" fill="#eeeef2" font-size="30" font-weight="600">Make the change clear before acting.</text><text x="36" y="91" fill="#b8b8c2" font-size="20" font-weight="400">The checks behind the public examples</text><circle cx="56" cy="234" r="14" fill="#77cdd5"/><text x="84" y="212" fill="#eeeef2" font-size="27" font-weight="600">Prepare</text><text x="36" y="287" fill="#b8b8c2" font-size="20" font-weight="400">The exact draft or</text><text x="36" y="317" fill="#b8b8c2" font-size="20" font-weight="400">change</text><path d="M71 234 L309 234" fill="none" stroke="#6d6d79" stroke-width="2"/><circle cx="323" cy="234" r="14" fill="#77cdd5"/><text x="351" y="212" fill="#eeeef2" font-size="27" font-weight="600">Review</text><text x="303" y="287" fill="#b8b8c2" font-size="20" font-weight="400">Scope, source and</text><text x="303" y="317" fill="#b8b8c2" font-size="20" font-weight="400">destination</text><path d="M338 234 L576 234" fill="none" stroke="#6d6d79" stroke-width="2"/><circle cx="590" cy="234" r="14" fill="#77cdd5"/><text x="618" y="212" fill="#eeeef2" font-size="27" font-weight="600">Approve</text><text x="570" y="287" fill="#b8b8c2" font-size="20" font-weight="400">Only the reviewed</text><text x="570" y="317" fill="#b8b8c2" font-size="20" font-weight="400">version</text><path d="M605 234 L843 234" fill="none" stroke="#6d6d79" stroke-width="2"/><circle cx="857" cy="234" r="14" fill="#77cdd5"/><text x="885" y="212" fill="#eeeef2" font-size="27" font-weight="600">Verify</text><text x="837" y="287" fill="#b8b8c2" font-size="20" font-weight="400">Check what actually</text><text x="837" y="317" fill="#b8b8c2" font-size="20" font-weight="400">happened</text></g></svg>