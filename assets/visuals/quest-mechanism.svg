<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">How Claude Quest works</title><desc id="desc">Reading, editing and tools create session events. Local checks handle repeated events; the companion progresses and saves locally without extra model calls.</desc><rect width="1100" height="600" fill="#202025"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="55" fill="#eeeef2" font-size="30" font-weight="600">Claude Quest</text><text x="36" y="91" fill="#b8b8c2" font-size="20" font-weight="400">Work activity becomes local progress.</text><rect x="36" y="151" width="516" height="116" rx="12" fill="#29292f" stroke="none"/><circle cx="63" cy="182" r="5" fill="#77cdd5"/><text x="81" y="191" fill="#eeeef2" font-size="27" font-weight="600">Session activity</text><text x="60" y="238" fill="#b8b8c2" font-size="23" font-weight="400">Read · Edit · Use tools</text><rect x="584" y="151" width="516" height="116" rx="12" fill="#29292f" stroke="none"/><circle cx="611" cy="182" r="5" fill="#77cdd5"/><text x="629" y="191" fill="#eeeef2" font-size="27" font-weight="600">Local event check</text><text x="608" y="238" fill="#b8b8c2" font-size="23" font-weight="400">Handle repeated events</text><rect x="36" y="346" width="516" height="116" rx="12" fill="#29292f" stroke="none"/><circle cx="63" cy="377" r="5" fill="#77cdd5"/><text x="81" y="386" fill="#eeeef2" font-size="27" font-weight="600">Companion progress</text><text x="60" y="433" fill="#b8b8c2" font-size="23" font-weight="400">Character · Gear · Camp</text><rect x="584" y="346" width="516" height="116" rx="12" fill="#29292f" stroke="none"/><circle cx="611" cy="377" r="5" fill="#77cdd5"/><text x="629" y="386" fill="#eeeef2" font-size="27" font-weight="600">Local save</text><text x="608" y="433" fill="#b8b8c2" font-size="23" font-weight="400">Keep progress between sessions</text><text x="36" y="566" fill="#77cdd5" font-size="22" font-weight="400">No extra model calls for progression.</text></g></svg>